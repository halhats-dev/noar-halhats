# Builds the parents' events page and publishes it to GitHub Pages.
# The page also refreshes itself live from the sheet; this build only refreshes the
# snapshot it shows first (and falls back to). No secrets: data comes from the public endpoint.
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # daily, 06:17 Israel time
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch events from the sheet endpoint
        run: python site/fetch_data.py
      - name: Build
        run: python site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
